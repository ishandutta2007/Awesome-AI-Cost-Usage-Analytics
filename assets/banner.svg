<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.25" />
    </pattern>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="45" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.12); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseDot {
      0%, 100% { r: 3; opacity: 0.4; }
      50% { r: 5; opacity: 1; }
    }
    .pulsing-orb-1 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .pulsing-orb-2 {
      animation: pulseGlow 9s ease-in-out infinite;
      transform-origin: 1050px 300px;
    }
    .floating-card-1 {
      animation: floatCard1 6s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatCard2 7s ease-in-out infinite;
    }
    .stream-line {
      stroke-dasharray: 8 6;
      animation: dashStream 4s linear infinite;
    }
    .live-dot {
      animation: pulseDot 2s ease-in-out infinite;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="pulsing-orb-1" cx="200" cy="100" r="160" fill="#38bdf8" opacity="0.18" filter="url(#glowCyan)" />
  <circle class="pulsing-orb-2" cx="1020" cy="300" r="180" fill="#a855f7" opacity="0.15" filter="url(#glowPurple)" />
  <circle cx="600" cy="380" r="140" fill="#06b6d4" opacity="0.1" filter="url(#glowCyan)" />

  <!-- Animated Data Streams in Background -->
  <path class="stream-line" d="M 50 180 Q 300 240 600 170 T 1150 200" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
  <path class="stream-line" d="M 80 280 Q 400 340 750 260 T 1120 310" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.25" style="animation-duration: 6s;" />

  <!-- Decorative Floating Analytics Mini-Cards (Left & Right Sides) -->
  <g class="floating-card-1" filter="url(#cardShadow)">
    <rect x="50" y="55" width="200" height="85" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="72" cy="80" r="4" fill="#10b981" class="live-dot" />
    <text x="84" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">TOKEN TELEMETRY</text>
    <text x="72" y="115" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">14.8M <tspan fill="#10b981" font-size="13" font-weight="600">tok/hr</tspan></text>
  </g>

  <g class="floating-card-2" filter="url(#cardShadow)">
    <rect x="950" y="55" width="200" height="85" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="972" cy="80" r="4" fill="#38bdf8" class="live-dot" />
    <text x="984" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">CACHE SAVINGS</text>
    <text x="972" y="115" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">42.6% <tspan fill="#38bdf8" font-size="13" font-weight="600">saved</tspan></text>
  </g>

  <!-- Foreground Title and Hero Content (Clean, Crisp, High-Contrast) -->
  <g id="hero-content">
    <!-- Category Badge -->
    <g transform="translate(450, 48)">
      <rect x="0" y="0" width="300" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#38bdf8" />
      <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" fill="url(#primaryTextGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome AI Cost &amp; Usage Analytics
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="195" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">
      The Premier FinOps &amp; Observability Directory for LLMs &amp; Coding Agents
    </text>

    <text x="600" y="232" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      Token Metering • AI Proxy Gateways • Real-Time Quota Monitors • Spend Attribution • Semantic Caching
    </text>

    <!-- Feature Pillars / Badges in Hero Footer -->
    <g transform="translate(185, 280)">
      <!-- Pill 1: FinOps -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
        <text x="90" y="26" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">⚡ LLM FinOps</text>
      </g>
      <!-- Pill 2: Observability -->
      <g transform="translate(210, 0)">
        <rect width="195" height="42" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6" />
        <text x="97" y="26" text-anchor="middle" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">🔍 Real-Time Tracing</text>
      </g>
      <!-- Pill 3: Agent Monitoring -->
      <g transform="translate(435, 0)">
        <rect width="205" height="42" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6" />
        <text x="102" y="26" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">🤖 Claude &amp; Agent Quotas</text>
      </g>
      <!-- Pill 4: Gateways -->
      <g transform="translate(670, 0)">
        <rect width="160" height="42" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1" stroke-opacity="0.6" />
        <text x="80" y="26" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">🛡️ AI Gateways</text>
      </g>
    </g>

    <!-- Bottom Accent Line -->
    <rect x="250" y="375" width="700" height="2" rx="1" fill="url(#accentGrad)" opacity="0.6" />
  </g>
</svg>
